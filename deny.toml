# cargo-deny 依赖审计配置
# 仅检查安全漏洞 (advisories)、多版本/禁用包 (bans)、来源合法性 (sources)；
# 暂不检查 licenses 以避免初期白名单噪声。

[advisories]
version = 2
# yanked 的 crate 视为错误（已被上游撤回）
yanked = "deny"
# 漏洞（vulnerability）一律阻断，不在此放行——下面只放行 unmaintained 类。
#
# unmaintained 只看本 workspace 的直接依赖：传递依赖用什么库不由我们决定，
# 上游不换我们换不掉，全量检查只会制造无法处理的红灯、让人开始忽略 CI 信号。
unmaintained = "workspace"
ignore = [
    # bincode：升级**清不掉**这条——通告的 patched 是空集，上游团队已永久停止
    # 开发，并明确表示 1.3.3 是完整版本、不需要再更新，所以 2.x / 3.x 同样被标记。
    # 要真正消除只能换掉这个库（postcard / bitcode / rkyv 等），但这里序列化的是
    # **已持久化在 SQLite 里的向量 blob**（memori-storage document_index.rs /
    # store.rs，格式为 u64 长度前缀 + f32 小端），换库会改变落盘格式，必须配套
    # 数据迁移或强制重建索引——属于产品决策，不在依赖升级范围内。
    # 现状：锁在 1.3.3（上游认定的完整版本），无已知漏洞，仅 informational。
    { id = "RUSTSEC-2025-0141", reason = "bincode 全版本均标记为 unmaintained（patched 为空），换库会改变已落盘的向量格式，需单独的数据迁移决策" },
]

[bans]
# 同一 crate 多版本只警告，不阻断 CI
multiple-versions = "warn"
# 允许 Cargo.toml 中的 wildcard 版本约束（内部 workspace crate 常见）
wildcards = "allow"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
