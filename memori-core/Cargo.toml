[package]
name = "memori-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Memori-Vault 核心调度引擎"

[dependencies]
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "signal", "fs"] }
thiserror.workspace = true
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
memori-vault = { path = "../memori-vault" }
memori-parser = { path = "../memori-parser" }
memori-storage = { path = "../memori-storage" }
dirs = "6.0.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
glob = "0.3.1"

[dev-dependencies]
# 仅 examples/phase2_diagnose.rs 需要：按与 memori-storage 相同的格式写向量 blob。
# 不是 memori-core 运行时依赖，放 dev 以免进入生产依赖图。
bincode = "1.3.3"
